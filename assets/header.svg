<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shiyuan Dennis Lyu — AI systems and research engineering</title>
  <desc id="desc">A minimal dark profile banner with a subtle animated node graph.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="68" y1="58" x2="68" y2="182" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="238" rx="17" fill="url(#bg)" stroke="#263449" stroke-width="2"/>
  <rect x="66" y="56" width="4" height="128" rx="2" fill="url(#accent)"/>

  <text x="96" y="103" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.3">Shiyuan (Dennis) Lyu</text>
  <text x="98" y="139" fill="#A8B5C7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="500">Computer Science · University of Toronto</text>
  <text x="98" y="171" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">AI systems / research tooling / useful software</text>

  <g opacity="0.72" stroke="#4B6787" stroke-width="1.6">
    <path d="M850 70L955 111L1070 71"/>
    <path d="M850 70L895 167L1005 174L1070 71"/>
    <path d="M955 111L1005 174"/>
  </g>

  <g fill="#101C2D" stroke="#6EA8D7" stroke-width="2">
    <circle cx="850" cy="70" r="10"/>
    <circle cx="955" cy="111" r="10"/>
    <circle cx="1070" cy="71" r="10"/>
    <circle cx="895" cy="167" r="10"/>
    <circle cx="1005" cy="174" r="10"/>
  </g>

  <circle r="5" fill="#67E8F9" filter="url(#softGlow)" opacity="0.65">
    <animateMotion dur="6s" repeatCount="indefinite" path="M850 70L955 111L1005 174L895 167L850 70"/>
  </circle>
  <circle r="3.5" fill="#E0F2FE">
    <animateMotion dur="6s" repeatCount="indefinite" path="M850 70L955 111L1005 174L895 167L850 70"/>
  </circle>

  <circle cx="1094" cy="188" r="4" fill="#34D399">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1108" y="193" fill="#7F8FA3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">building</text>
</svg>
